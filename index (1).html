<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Agenda Pastelera</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#C0405F">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda Pastelera">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7EFE0;
    --surface: #FFFDF8;
    --kraft: #B78A5A;
    --kraft-dark: #7A5230;
    --berry: #C0405F;
    --berry-dark: #97324A;
    --mint: #6E9C7D;
    --mint-bg: #E7F0E7;
    --butter: #E3A62F;
    --butter-bg: #FBF0D6;
    --danger: #B94A3D;
    --danger-bg: #F7E3DF;
    --text: #3A2A1D;
    --text-soft: #8A7658;
    --text-soft2: #8A7658;
    --line: #E5D7BF;
    --radius-card: 14px;
    --shadow: 0 2px 10px rgba(58,42,29,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Karla', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,.display{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: var(--text);
    margin: 0;
  }
  #app{
    max-width: 720px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 84px;
    position: relative;
  }
  .topbar{
    padding: 22px 20px 16px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #FBF3E4, var(--bg));
  }
  .topbar h1{ font-size: 26px; letter-spacing:-0.01em;}
  .topbar .sub{ font-size: 12.5px; color: var(--text-soft2); margin-top:2px;}
  .topbar .badge{
    font-family:'Fraunces',serif;
    font-size: 12px;
    color: var(--kraft-dark);
    border: 1px solid var(--kraft);
    padding: 3px 10px;
    border-radius: 100px;
    white-space:nowrap;
  }
  .view{ display:none; padding: 18px 18px 8px; animation: fadeIn .18s ease; }
  .view.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform: translateY(4px);} to{opacity:1; transform:none;} }

  .section-head{ display:flex; align-items:center; justify-content:space-between; margin: 4px 0 14px; }
  .section-head h2{ font-size: 20px; }
  .add-btn{
    background: var(--berry);
    color:#fff;
    border:none;
    padding: 9px 16px;
    border-radius: 100px;
    font-family:'Karla',sans-serif;
    font-weight:700;
    font-size: 13.5px;
    cursor:pointer;
    box-shadow: 0 2px 8px rgba(192,64,95,0.3);
  }
  .add-btn:active{ transform: scale(0.97); }

  .empty{
    text-align:center;
    padding: 46px 18px;
    color: var(--text-soft2);
  }
  .empty .icon{ font-size: 34px; display:block; margin-bottom:10px;}
  .empty p{ margin: 4px 0; font-size: 14px; }

  /* Order ticket card */
  .ticket{
    background: var(--surface);
    border: 1px dashed var(--kraft);
    border-radius: var(--radius-card);
    padding: 14px 16px;
    margin-bottom: 12px;
    position: relative;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .ticket:active{ transform: scale(0.995); }
  .ticket-hint{ font-size:11px; color: var(--text-soft2); text-align:center; margin: -6px 0 14px; }
  .filter-row{ display:flex; gap:8px; margin-bottom:14px; }
  .filter-chip{
    flex:1;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-soft2);
    padding: 9px 8px;
    border-radius: 100px;
    font-size: 12.5px;
    font-weight:700;
    cursor:pointer;
    font-family:'Karla',sans-serif;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .filter-chip .dot{ width:7px; height:7px; border-radius:50%; }
  .filter-chip.active{ border-color: var(--berry); color: var(--berry-dark); background:#FBEEF1; }

  /* Detail view */
  .detail-toggle{ display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:18px; }
  .detail-toggle button{
    flex:1; padding:11px; border:none; background:#fff; color: var(--text-soft2);
    font-family:'Karla',sans-serif; font-weight:700; font-size:13.5px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .detail-toggle button.active.open{ background: var(--butter-bg); color:#8a6410; }
  .detail-toggle button.active.delivered{ background: var(--mint-bg); color:#2F5C3E; }
  .detail-block{
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .detail-block-head{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .detail-block-head .dicon{ font-size:15px; }
  .detail-block-head b{ font-family:'Fraunces',serif; font-size:15px; font-weight:600; }
  .detail-block-sub{ font-size:11.5px; color:var(--text-soft2); margin: -8px 0 12px; }
  .drow{ display:flex; justify-content:space-between; gap:10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size:13.5px; }
  .drow:last-child{ border-bottom:none; }
  .drow .k{ color: var(--text-soft2); flex-shrink:0; }
  .drow .v{ text-align:right; font-weight:600; }
  .fin-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:4px; }
  .fin-row .fk{ font-size:11.5px; color:var(--text-soft2); }
  .fin-row .fv{ font-family:'Fraunces',serif; font-weight:700; font-size:17px; }
  .fin-op{ color: var(--text-soft2); font-size:15px; }
  .fin-final .fv{ color: var(--berry); }
  .notes-label{ font-size:11.5px; font-weight:700; color: var(--text-soft2); margin-bottom:3px; display:flex; align-items:center; gap:5px;}
  .notes-text{ font-size:13.5px; margin-bottom:12px; white-space:pre-wrap; }
  .photo-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:10px; }
  .photo-thumb{ position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-thumb .rm{ position:absolute; top:3px; right:3px; background:rgba(0,0,0,0.55); color:#fff; border:none; width:20px; height:20px; border-radius:50%; font-size:12px; cursor:pointer; line-height:1; }
  .add-photo-btn{
    border: 1px dashed var(--kraft);
    background:none;
    color: var(--kraft-dark);
    padding: 11px;
    border-radius: 10px;
    width:100%;
    font-family:'Karla',sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .ticket-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .ticket-top .name{ font-family:'Fraunces',serif; font-weight:600; font-size:16.5px; }
  .ticket-top .prod{ font-size: 13.5px; color: var(--text-soft2); margin-top:2px; }
  .stamp{
    font-size: 10.5px;
    font-weight:700;
    padding: 4px 9px;
    border-radius: 6px;
    transform: rotate(-3deg);
    white-space:nowrap;
    text-transform: none;
    letter-spacing: 0.02em;
  }
  .stamp.pendiente{ background: var(--butter-bg); color:#8a6410; border:1px solid var(--butter);}
  .stamp.en_proceso{ background:#E4E9F5; color:#3C4E9C; border:1px solid #8C9FDA;}
  .stamp.listo{ background: var(--mint-bg); color:#2F5C3E; border:1px solid var(--mint);}
  .stamp.entregado{ background:#EFEAE3; color:#6b5c47; border:1px solid #C9BBA4;}
  .ticket-meta{ display:flex; flex-wrap:wrap; gap: 10px 16px; margin-top: 10px; font-size: 13px; color: var(--text-soft2); }
  .ticket-meta b{ color: var(--text); font-weight:600;}
  .ticket-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .btn-mini{
    border:1px solid var(--line);
    background:#fff;
    color: var(--text);
    padding: 7px 11px;
    border-radius: 9px;
    font-size:12.5px;
    font-family:'Karla',sans-serif;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .btn-mini.whatsapp{ border-color:#3FA755; color:#2E7D3F; background:#EEFBF0;}
  .btn-mini.edit{ border-color: var(--kraft); color: var(--kraft-dark); }
  .btn-mini.danger{ border-color: var(--danger); color: var(--danger); }
  .btn-mini:active{ transform: scale(0.96); }

  select.status-select{
    font-family:'Karla',sans-serif;
    font-size:12.5px;
    font-weight:600;
    border-radius: 9px;
    border: 1px solid var(--line);
    padding: 7px 8px;
    background:#fff;
    color: var(--text);
  }

  /* Client row */
  .client-row{
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 12px 14px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  .client-row .info b{ font-family:'Fraunces',serif; font-size:15.5px; font-weight:600;}
  .client-row .info div.phone{ font-size:12.5px; color: var(--text-soft2); margin-top:2px;}
  .client-row .actions{ display:flex; gap:6px; flex-shrink:0;}

  /* Calendar */
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-nav-btn{ background:none; border:1px solid var(--line); border-radius:8px; width:32px; height:32px; font-size:16px; cursor:pointer; color: var(--kraft-dark); }
  .cal-title{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; text-transform: capitalize;}
  .cal-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:5px; }
  .cal-dow{ text-align:center; font-size:10.5px; color: var(--text-soft2); font-weight:700; padding-bottom:4px;}
  .cal-day{
    aspect-ratio: 1;
    border-radius: 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size: 13px;
    background: var(--surface);
    border: 1px solid var(--line);
    cursor:pointer;
    position:relative;
    color: var(--text);
  }
  .cal-day.empty-day{ background:transparent; border:none; cursor:default; }
  .cal-day.today{ border: 2px solid var(--kraft); font-weight:700; }
  .cal-day.selected{ background: var(--berry); color:#fff; border-color: var(--berry); }
  .cal-day .dot{ width:5px; height:5px; border-radius:50%; background: var(--berry); margin-top:3px; }
  .cal-day.selected .dot{ background:#fff; }
  .cal-day-list{ margin-top: 18px; }
  .cal-day-list h3{ font-size: 14.5px; margin-bottom: 10px; color: var(--text-soft2); font-weight:700; font-family:'Karla',sans-serif;}

  /* Inventory */
  .ing-row{
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 12px 14px;
    margin-bottom:10px;
    box-shadow: var(--shadow);
  }
  .ing-top{ display:flex; justify-content:space-between; align-items:center; }
  .ing-top b{ font-family:'Fraunces',serif; font-size:15.5px; font-weight:600;}
  .ing-low{ color: var(--danger); font-size:11.5px; font-weight:700; background: var(--danger-bg); padding:3px 8px; border-radius:100px; }
  .ing-stock-row{ display:flex; align-items:center; gap:10px; margin-top:9px; }
  .stock-bar-track{ flex:1; height:7px; background:#EDE3D0; border-radius:100px; overflow:hidden;}
  .stock-bar-fill{ height:100%; background: var(--mint); border-radius:100px; }
  .stock-bar-fill.low{ background: var(--danger); }
  .stock-num{ font-size:12.5px; color: var(--text-soft2); white-space:nowrap; min-width:70px; text-align:right;}
  .qty-btns{ display:flex; gap:6px; margin-top:9px; }
  .qty-btn{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:15px; cursor:pointer; color:var(--kraft-dark); font-weight:700;}

  /* Pricing */
  .price-card{
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 14px 16px;
    margin-bottom:12px;
    box-shadow: var(--shadow);
  }
  .price-card .p-name{ font-family:'Fraunces',serif; font-size:16.5px; font-weight:600; }
  .price-card .p-breakdown{ font-size:12.5px; color: var(--text-soft2); margin-top:4px; }
  .price-card .p-final{ margin-top: 10px; display:flex; align-items:baseline; gap:6px; }
  .price-card .p-final .amount{ font-family:'Fraunces',serif; font-size: 22px; font-weight:700; color: var(--butter); }
  .price-card .p-final .label{ font-size:11.5px; color: var(--text-soft2); }

  /* Bottom nav */
  .bottomnav{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:720px;
    margin:0 auto;
    background: var(--surface);
    border-top: 1px solid var(--line);
    display:flex;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbtn{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding: 8px 2px 6px;
    cursor:pointer;
    color: var(--text-soft2);
    font-family:'Karla',sans-serif;
    border-radius: 10px;
  }
  .navbtn .ic{ font-size: 19px; line-height:1; }
  .navbtn .lb{ font-size: 10px; font-weight:700; }
  .navbtn.active{ color: var(--berry); background: #FBEEF1; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background: rgba(58,42,29,0.42);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background: var(--bg);
    width:100%;
    max-width: 720px;
    max-height: 88vh;
    overflow-y:auto;
    border-radius: 22px 22px 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    animation: slideUp .22s ease;
  }
  @keyframes slideUp{ from{ transform: translateY(24px); opacity:0;} to{ transform:none; opacity:1;} }
  .modal h2{ font-size:19px; margin-bottom: 16px; }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color: var(--text-soft2); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    font-family:'Karla',sans-serif;
    font-size: 14.5px;
    background:#fff;
    color: var(--text);
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn-primary{
    flex:1;
    background: var(--berry);
    color:#fff;
    border:none;
    padding: 13px;
    border-radius: 12px;
    font-weight:700;
    font-size:15px;
    font-family:'Karla',sans-serif;
    cursor:pointer;
  }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .icon-btn{
    background:#fff;
    border:1px solid var(--line);
    width:36px; height:36px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    color: var(--kraft-dark);
    flex-shrink:0;
  }
  .icon-btn:active{ transform: scale(0.95); }
  .drive-dot{ width:8px; height:8px; border-radius:50%; background: var(--mint); flex-shrink:0; }
  .drive-dot.syncing{ background: var(--butter); animation: pulse 1s infinite; }
  .drive-dot.error{ background: var(--danger); animation: none; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .lock-screen{
    position:fixed; inset:0; z-index:100;
    background: var(--bg);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 24px;
    text-align:center;
  }
  .lock-screen .emoji{ font-size:38px; margin-bottom:6px; }
  .lock-screen h2{ font-size:19px; }
  .lock-screen p{ color: var(--text-soft2); font-size:13.5px; margin: 6px 0 18px; max-width:280px; }
  .lock-input{
    text-align:center;
    font-size: 24px;
    letter-spacing: 8px;
    max-width: 180px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    margin-bottom: 10px;
    font-family:'Karla',sans-serif;
    background:#fff;
    color: var(--text);
  }
  .lock-error{ color: var(--danger); font-size:12.5px; min-height:16px; margin-bottom:12px; }

  .btn-secondary{
    background:#fff;
    color: var(--text-soft2);
    border:1px solid var(--line);
    padding: 13px 18px;
    border-radius:12px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .helper{ font-size:11.5px; color: var(--text-soft2); margin-top:-8px; margin-bottom:14px; }
  .loading{ text-align:center; padding: 80px 20px; color: var(--text-soft2); font-family:'Fraunces',serif; font-size:16px;}
  .toast{
    position:fixed; bottom: 96px; left:50%; transform:translateX(-50%);
    background: var(--text); color:#fff; padding:10px 18px; border-radius:100px;
    font-size:13.5px; z-index:60; box-shadow:0 4px 14px rgba(0,0,0,0.25);
    opacity:0; pointer-events:none; transition: opacity .2s ease;
  }
  .toast.show{ opacity:1; }

  /* Filtro Abiertos / Entregados */
  .filter-tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .filter-tab{
    flex:1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 10px;
    font-family:'Karla',sans-serif;
    font-weight:700;
    font-size: 13px;
    cursor:pointer;
    color: var(--text-soft2);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .filter-tab .dot{ width:8px; height:8px; border-radius:50%; }
  .filter-tab.active{ border-color: var(--berry); color: var(--berry-dark); background: #FBEEF1; }
  .ticket.clickable{ cursor:pointer; }

  /* Vista de detalle del pedido */
  .toggle-row{ display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:18px; }
  .toggle-row button{
    flex:1; border:none; background:#fff; padding:11px; font-family:'Karla',sans-serif;
    font-weight:700; font-size:13.5px; cursor:pointer; color: var(--text-soft2);
  }
  .toggle-row button.active-open{ background: var(--butter-bg); color:#8a6410; }
  .toggle-row button.active-delivered{ background: var(--mint-bg); color:#2F5C3E; }
  .detail-card{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-card);
    padding: 14px 16px; margin-bottom:14px;
  }
  .detail-section-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; margin-bottom:12px;
    display:flex; align-items:center; gap:8px;
  }
  .detail-row{ margin-bottom:12px; }
  .detail-row:last-child{ margin-bottom:0; }
  .detail-row label{ display:block; font-size:11px; font-weight:700; color: var(--text-soft2); margin-bottom:2px; text-transform:none; }
  .detail-row .val{ font-size:14.5px; color: var(--text); }
  .detail-row .val.empty{ color: var(--text-soft2); font-style:italic; }
  .finance-grid{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .finance-grid .fbox{ text-align:center; flex:1; min-width:80px; }
  .finance-grid .fbox .flabel{ font-size:10.5px; color: var(--text-soft2); font-weight:700; margin-bottom:3px; }
  .finance-grid .fbox .fval{ font-family:'Fraunces',serif; font-weight:700; font-size:16px; }
  .finance-grid .fsep{ font-size:16px; color: var(--text-soft2); }

  @media (min-width: 720px){
    .bottomnav{ border-radius: 16px 16px 0 0; }
  }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="emoji">🔒</div>
  <h2>Agenda protegida</h2>
  <p>Ingresa tu PIN para continuar.</p>
  <input class="lock-input" id="lockInput" type="password" inputmode="numeric" maxlength="8" placeholder="••••" onkeydown="if(event.key==='Enter') tryUnlock()">
  <div class="lock-error" id="lockError"></div>
  <button class="btn-primary" style="max-width:200px;" onclick="tryUnlock()">Desbloquear</button>
</div>

<div class="lock-screen" id="driveScreen"></div>

<div id="app">

<script>
/* ---------------- Configuración de Google Drive ---------------- */
/* 1) Pega aquí tu Client ID de Google Cloud (tipo "Aplicación web"). */
const GOOGLE_CLIENT_ID = 'PON_AQUI_TU_CLIENT_ID.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILENAME = 'agenda_pastelera_data.json';

/* ---------------- Estado y almacenamiento ---------------- */
let DATA = { clientes: [], pedidos: [], productos: [], inventario: [] };
let CONFIG = { miWhatsapp: '', nombreNegocio: '', infoNegocio: '', pin: '', pinEnabled: false };
let currentTab = 'pedidos';
let calDate = new Date();
let calSelected = null;

let STORAGE_MODE = null; // 'claude' | 'drive'
let driveTokenClient = null;
let driveToken = null;
let driveFileId = null;
let driveState = { clientes:[], pedidos:[], productos:[], inventario:[], config:{} };
let driveSaveTimer = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function loadObj(key, fallback){
  if(STORAGE_MODE === 'drive'){
    return (key in driveState) ? driveState[key] : fallback;
  }
  if(STORAGE_MODE === 'local'){
    try{ const v = await idbGet(key); return (v===undefined) ? fallback : v; }
    catch(e){ return fallback; }
  }
  try{
    const r = await window.storage.get(key, false);
    return r && r.value ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function saveObj(key, obj){
  if(STORAGE_MODE === 'drive'){
    driveState[key] = obj;
    scheduleDriveSave();
    return;
  }
  if(STORAGE_MODE === 'local'){
    try{ await idbSet(key, obj); }
    catch(e){ showToast('⚠️ No se pudo guardar en este teléfono.'); }
    return;
  }
  try{ await window.storage.set(key, JSON.stringify(obj), false); }
  catch(e){ showToast('No se pudo guardar. Intenta de nuevo.'); }
}
// Alias para compatibilidad con listas
const loadKey = (key)=> loadObj(key, []);
const saveKey = (key, arr)=> saveObj(key, arr);

async function loadAll(){
  const [clientes, pedidos, productos, inventario, config] = await Promise.all([
    loadKey('clientes'), loadKey('pedidos'), loadKey('productos'), loadKey('inventario'),
    loadObj('config', { miWhatsapp:'', nombreNegocio:'', infoNegocio:'', pin:'', pinEnabled:false })
  ]);
  DATA.clientes = clientes; DATA.pedidos = pedidos; DATA.productos = productos; DATA.inventario = inventario;
  CONFIG = config;
}

/* ---------------- Modo local (IndexedDB, sin internet) ---------------- */
const IDB_NAME = 'agendaPasteleraDB';
const IDB_STORE = 'kv';
let idbInstance = null;
function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(idbInstance){ resolve(idbInstance); return; }
    if(!('indexedDB' in window)){ reject(new Error('no_indexeddb')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>{ idbInstance = req.result; resolve(idbInstance); };
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}

/* ---------------- Modo Google Drive ---------------- */
function scheduleDriveSave(){
  clearTimeout(driveSaveTimer);
  driveSaveTimer = setTimeout(driveWriteFile, 900);
  const el = document.getElementById('driveStatusDot');
  if(el){ el.classList.add('syncing'); el.classList.remove('error'); el.title = 'Guardando en Drive…'; }
}

function requestDriveTokenSilently(){
  return new Promise((resolve)=>{
    if(!driveTokenClient){ resolve(false); return; }
    const originalCallback = driveTokenClient.callback;
    driveTokenClient.callback = (resp)=>{
      driveTokenClient.callback = originalCallback;
      if(resp && !resp.error){ driveToken = resp.access_token; resolve(true); }
      else resolve(false);
    };
    driveTokenClient.requestAccessToken({ prompt: '' });
  });
}

// Wrapper de fetch para Drive: agrega el token y renueva/reintenta una vez si expiró (401).
async function driveFetch(url, options, isRetry){
  options = options || {};
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + driveToken });
  const res = await fetch(url, options);
  if(res.status === 401 && !isRetry){
    const refreshed = await requestDriveTokenSilently();
    if(refreshed) return driveFetch(url, options, true);
  }
  return res;
}

async function driveWriteFile(){
  const el = document.getElementById('driveStatusDot');
  if(!driveToken){ if(el){ el.classList.remove('syncing'); el.classList.add('error'); el.title='No conectado a Drive'; } return; }
  if(!driveFileId){
    try{ await driveLoadOrCreateFile(); }
    catch(e){
      showToast('⚠️ No se pudo guardar en Drive: no se encontró el archivo.');
      if(el){ el.classList.remove('syncing'); el.classList.add('error'); el.title='Error al guardar'; }
      return;
    }
  }
  try{
    const res = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
      method:'PATCH',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(driveState)
    });
    if(!res.ok){
      const errText = await res.text().catch(()=> '');
      console.error('Drive save error', res.status, errText);
      showToast('⚠️ No se pudo guardar en Drive (error ' + res.status + '). Vuelve a intentarlo.');
      if(el){ el.classList.remove('syncing'); el.classList.add('error'); el.title='Error al guardar en Drive'; }
      return;
    }
    if(el){ el.classList.remove('syncing'); el.classList.remove('error'); el.title='Guardado en Drive'; }
  }catch(e){
    showToast('⚠️ No se pudo guardar en Drive. Revisa tu conexión.');
    if(el){ el.classList.remove('syncing'); el.classList.add('error'); el.title='Error al guardar en Drive'; }
  }
}

function initGoogleAuth(){
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp)=>{
      if(!resp || resp.error){
        renderDriveConnectScreen('No se pudo conectar con Google. Intenta de nuevo.');
        return;
      }
      driveToken = resp.access_token;
      try{ localStorage.setItem('agendaDriveConnected','1'); }catch(e){}
      try{
        await driveLoadOrCreateFile();
        finishInit();
      }catch(e){
        console.error('Drive init error', e);
        renderDriveConnectScreen('Hubo un problema leyendo tu Drive. Intenta de nuevo.');
      }
    }
  });
}
function connectDrive(interactive){
  if(!driveTokenClient){ return; }
  driveTokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
}
function disconnectDrive(){
  if(driveToken){
    try{ google.accounts.oauth2.revoke(driveToken, ()=>{}); }catch(e){}
  }
  try{ localStorage.removeItem('agendaDriveConnected'); }catch(e){}
  driveToken = null; driveFileId = null;
  closeModal();
  renderDriveConnectScreen();
}

async function driveLoadOrCreateFile(){
  const searchRes = await driveFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27${DRIVE_FILENAME}%27&fields=files(id,name)`);
  if(!searchRes.ok){
    const errText = await searchRes.text().catch(()=> '');
    console.error('Drive search error', searchRes.status, errText);
    throw new Error('drive_search_failed:' + searchRes.status);
  }
  const searchData = await searchRes.json();
  if(searchData.files && searchData.files.length){
    driveFileId = searchData.files[0].id;
    const fileRes = await driveFetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`);
    if(!fileRes.ok){
      const errText = await fileRes.text().catch(()=> '');
      console.error('Drive read error', fileRes.status, errText);
      throw new Error('drive_read_failed:' + fileRes.status);
    }
    const text = await fileRes.text();
    try{ driveState = text ? JSON.parse(text) : driveState; }catch(e){ /* archivo vacío o dañado, se usa el estado por defecto */ }
  } else {
    const metadata = { name: DRIVE_FILENAME, parents:['appDataFolder'] };
    const boundary = 'agenda_pastelera_boundary';
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(driveState)}\r\n--${boundary}--`;
    const createRes = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method:'POST',
      headers:{ 'Content-Type':`multipart/related; boundary=${boundary}` },
      body
    });
    if(!createRes.ok){
      const errText = await createRes.text().catch(()=> '');
      console.error('Drive create error', createRes.status, errText);
      throw new Error('drive_create_failed:' + createRes.status);
    }
    const createData = await createRes.json();
    if(!createData.id){
      console.error('Drive create returned no id', createData);
      throw new Error('drive_create_no_id');
    }
    driveFileId = createData.id;
  }
  DATA.clientes = driveState.clientes || [];
  DATA.pedidos = driveState.pedidos || [];
  DATA.productos = driveState.productos || [];
  DATA.inventario = driveState.inventario || [];
  CONFIG = Object.assign({ miWhatsapp:'', nombreNegocio:'', infoNegocio:'', pin:'', pinEnabled:false }, driveState.config || {});
}

function renderDriveConnectScreen(errorMsg){
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  const el = document.getElementById('driveScreen');
  el.innerHTML = `
    <div class="emoji">🧁☁️</div>
    <h2>Conecta tu Google Drive</h2>
    <p>Tus pedidos, clientes e inventario se guardarán en tu Drive y estarán disponibles en cualquier celular o computador donde inicies sesión con tu cuenta de Google.</p>
    ${errorMsg ? `<p style="color:var(--danger); font-size:13px; margin:-8px 0 16px;">${errorMsg}</p>` : ''}
    <button class="btn-primary" style="max-width:260px;" onclick="connectDrive(true)">Conectar con Google</button>
  `;
  el.style.display = 'flex';
}
function renderDriveConfigError(msg){
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  const el = document.getElementById('driveScreen');
  el.innerHTML = `
    <div class="emoji">⚠️</div>
    <h2>No se pudo conectar</h2>
    <p>${msg}</p>
  `;
  el.style.display = 'flex';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- Navegación ---------------- */
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='pedidos') renderPedidos();
  if(tab==='clientes') renderClientes();
  if(tab==='calendario') renderCalendar();
  if(tab==='precios') renderPrecios();
  if(tab==='inventario') renderInventario();
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('modalBody').innerHTML = '';
}
function openModalHtml(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}

/* ---------------- Utilidades ---------------- */
function fmtMoney(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-CO', {maximumFractionDigits:0});
}
function fmtDateHuman(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-ES', {weekday:'short', day:'numeric', month:'short'});
}
function digitsOnly(s){ return (s||'').replace(/\D/g,''); }
function statusLabel(s){
  return {pendiente:'Pendiente', en_proceso:'En proceso', listo:'Listo', entregado:'Entregado'}[s] || s;
}

/* ---------------- PEDIDOS ---------------- */
let pedidosFiltro = 'abiertos';

function renderPedidos(){
  const list = document.getElementById('pedidosList');
  updateBadge();
  let pedidos = [...DATA.pedidos].sort((a,b)=> (a.fechaEntrega||'').localeCompare(b.fechaEntrega||''));
  pedidos = pedidos.filter(p => pedidosFiltro === 'abiertos' ? p.estado !== 'entregado' : p.estado === 'entregado');

  const filterHtml = `
    <div class="filter-row">
      <button class="filter-chip ${pedidosFiltro==='abiertos'?'active':''}" onclick="setPedidosFiltro('abiertos')"><span class="dot" style="background:var(--berry);"></span>Abiertos</button>
      <button class="filter-chip ${pedidosFiltro==='entregados'?'active':''}" onclick="setPedidosFiltro('entregados')"><span class="dot" style="background:var(--kraft);"></span>Entregados</button>
    </div>`;

  if(pedidos.length===0){
    list.innerHTML = filterHtml + `<div class="empty"><span class="icon">🧁</span><p><b>${pedidosFiltro==='abiertos' ? 'No hay pedidos abiertos.' : 'Aún no hay pedidos entregados.'}</b></p><p>${pedidosFiltro==='abiertos' ? 'Toca "Nuevo pedido" para anotar el primero.' : ''}</p></div>`;
    return;
  }
  list.innerHTML = filterHtml + `<div class="ticket-hint">Toca un pedido para ver los detalles</div>` + pedidos.map(p => `
    <div class="ticket" onclick="openPedidoDetail('${p.id}')">
      <div class="ticket-top">
        <div>
          <div class="name">${escapeHtml(p.clienteNombre)}</div>
          <div class="prod">${escapeHtml(p.producto)} · x${p.cantidad}</div>
        </div>
        <div class="stamp ${p.estado}">${statusLabel(p.estado)}</div>
      </div>
      <div class="ticket-meta">
        <div>📅 <b>${fmtDateHuman(p.fechaEntrega)}</b>${p.hora?(' · '+p.hora):''}</div>
        <div>💲 <b>${fmtMoney(p.precio)}</b></div>
        ${(p.saldo>0) ? `<div style="color:var(--danger);">⚠️ Debe: <b>${fmtMoney(p.saldo)}</b></div>` : (p.precio>0 ? `<div style="color:var(--mint);">✓ Pagado</div>` : '')}
      </div>
    </div>
  `).join('');
}

function setPedidosFiltro(f){
  pedidosFiltro = f;
  renderPedidos();
}

function updateBadge(){
  const pending = DATA.pedidos.filter(p=>p.estado!=='entregado').length;
  document.getElementById('pendingBadge').textContent = pending + (pending===1?' pendiente':' pendientes');
}

async function setPedidoEstado(id, estado){
  const p = DATA.pedidos.find(x=>x.id===id);
  if(!p) return;
  p.estado = estado;
  await saveKey('pedidos', DATA.pedidos);
  renderPedidos();
}

/* ---- Vista de detalle del pedido ---- */
async function openPedidoDetail(id){
  const p = DATA.pedidos.find(x=>x.id===id);
  if(!p) return;
  const isEntregado = p.estado === 'entregado';
  const fotos = await loadObj('fotos:'+id, []);

  openModalHtml(`
    <h2>Detalles del pedido</h2>

    <div class="detail-toggle">
      <button class="${!isEntregado?'active open':''}" onclick="toggleEntregado('${p.id}', false)">📅 Abierto</button>
      <button class="${isEntregado?'active delivered':''}" onclick="toggleEntregado('${p.id}', true)">✅ Entregado</button>
    </div>

    <div class="detail-block">
      <div class="detail-block-head"><span class="dicon">🗓️</span><b>Información de la orden</b></div>
      <div class="drow"><div class="k">Cliente</div><div class="v">${escapeHtml(p.clienteNombre)}</div></div>
      <div class="drow"><div class="k">Entrega</div><div class="v">${fmtDateHuman(p.fechaEntrega)}</div></div>
      <div class="drow"><div class="k">Hora entrega</div><div class="v">${p.hora ? escapeHtml(p.hora)+' hrs' : '—'}</div></div>
      <div class="drow"><div class="k">Contacto</div><div class="v">${p.telefono ? escapeHtml(p.telefono) : '—'}</div></div>
      ${!isEntregado ? `<div class="drow"><div class="k">Estado</div><div class="v">
        <select class="status-select" onchange="setPedidoEstadoDetail('${p.id}', this.value)">
          ${['pendiente','en_proceso','listo'].map(s=>`<option value="${s}" ${s===p.estado?'selected':''}>${statusLabel(s)}</option>`).join('')}
        </select>
      </div></div>` : ''}
    </div>

    <div class="detail-block">
      <div class="detail-block-head"><span class="dicon">🧁</span><b>Producto solicitado</b></div>
      <div class="drow"><div class="k">Nombre / tipo</div><div class="v">${escapeHtml(p.producto)}</div></div>
      <div class="drow"><div class="k">Cantidad</div><div class="v">${p.cantidad}</div></div>
      <div class="drow"><div class="k">Precio unitario</div><div class="v">${fmtMoney(p.precioUnitario!=null ? p.precioUnitario : (p.precio/(p.cantidad||1)))}</div></div>
      ${p.tamano ? `<div class="drow"><div class="k">Tamaño</div><div class="v">${escapeHtml(p.tamano)}</div></div>` : ''}
      ${p.saborMasa ? `<div class="drow"><div class="k">Sabor de masa</div><div class="v">${escapeHtml(p.saborMasa)}</div></div>` : ''}
      ${p.saborRelleno ? `<div class="drow"><div class="k">Sabor de relleno</div><div class="v">${escapeHtml(p.saborRelleno)}</div></div>` : ''}
      ${p.decoracion ? `<div class="drow"><div class="k">Decoración</div><div class="v">${escapeHtml(p.decoracion)}</div></div>` : ''}
    </div>

    <div class="detail-block">
      <div class="detail-block-head"><span class="dicon">💲</span><b>Información financiera</b></div>
      <div class="detail-block-sub">(Total − Anticipo = Por cobrar)</div>
      <div class="fin-row">
        <div><div class="fk">Total</div><div class="fv">${fmtMoney(p.precio)}</div></div>
        <div class="fin-op">−</div>
        <div><div class="fk">Anticipo</div><div class="fv">${fmtMoney(p.abono||0)}</div></div>
        <div class="fin-op">=</div>
        <div class="fin-final"><div class="fk">Por cobrar</div><div class="fv">${fmtMoney(p.saldo!=null?p.saldo:(p.precio-(p.abono||0)))}</div></div>
      </div>
    </div>

    <div class="detail-block">
      <div class="detail-block-head"><span class="dicon">📝</span><b>Notas adicionales</b></div>
      <div class="notes-label">🔒 Notas internas (privadas)</div>
      <div class="notes-text">${p.notasPrivadas ? escapeHtml(p.notasPrivadas) : 'Sin notas privadas'}</div>
      <div class="notes-label">💬 Notas públicas para el cliente</div>
      <div class="notes-text">${p.notas ? escapeHtml(p.notas) : 'Sin notas públicas'}</div>
      <div class="notes-label">🏪 Datos permanentes de tu negocio</div>
      <div class="notes-text">${CONFIG.nombreNegocio || CONFIG.infoNegocio ? `${escapeHtml(CONFIG.nombreNegocio||'')}${CONFIG.infoNegocio ? ' — '+escapeHtml(CONFIG.infoNegocio) : ''}` : 'Configúralos en Ajustes ⚙️'}</div>
    </div>

    <div class="detail-block">
      <div class="detail-block-head"><span class="dicon">📷</span><b>Fotos del pedido</b></div>
      ${fotos.length ? `<div class="photo-grid">${fotos.map((f,idx)=>`

function addFoto(id, input){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 500*1024){
    showToast('Esa foto pesa mucho, prueba con una más liviana (máx. 500KB)');
    return;
  }
  const reader = new FileReader();
  reader.onload = async ()=>{
    const fotos = await loadObj('fotos:'+id, []);
    if(fotos.length >= 5){ showToast('Máximo 5 fotos por pedido'); return; }
    fotos.push(reader.result);
    await saveObj('fotos:'+id, fotos);
    openPedidoDetail(id);
  };
  reader.readAsDataURL(file);
}

async function removeFoto(id, idx){
  const fotos = await loadObj('fotos:'+id, []);
  fotos.splice(idx,1);
  await saveObj('fotos:'+id, fotos);
  openPedidoDetail(id);
}

function updateSaldoPreview(){
  const precioUnit = Number(document.getElementById('f-precio').value)||0;
  const cantidad = Number(document.getElementById('f-cantidad').value)||1;
  const abono = Number(document.getElementById('f-abono').value)||0;
  const total = precioUnit * cantidad;
  const saldo = Math.max(0, total - abono);
  document.getElementById('saldoPreview').textContent = `Total: ${fmtMoney(total)} · ` + (saldo > 0
    ? `Debe: ${fmtMoney(saldo)}`
    : (total > 0 ? 'Pagado por completo ✓' : 'Debe: $0'));
}

function onClienteSelectChange(){

async function savePedido(id){
  let clienteId = document.getElementById('f-cliente').value;
  let clienteNombre = '', telefono = '';

  if(clienteId === '__nuevo'){
    const nombre = document.getElementById('f-cliente-nombre').value.trim();
    const tel = digitsOnly(document.getElementById('f-cliente-telefono').value);
    if(!nombre){ showToast('Escribe el nombre del cliente'); return; }
    const nuevoCliente = { id: uid(), nombre, telefono: tel, notas:'' };
    DATA.clientes.push(nuevoCliente);
    await saveKey('clientes', DATA.clientes);
    clienteId = nuevoCliente.id; clienteNombre = nombre; telefono = tel;
  } else if(clienteId){
    const c = DATA.clientes.find(x=>x.id===clienteId);
    clienteNombre = c ? c.nombre : '';
    telefono = c ? c.telefono : '';
  } else {
    showToast('Selecciona o crea un cliente');
    return;
  }

  const producto = document.getElementById('f-producto').value.trim();
  const cantidad = Number(document.getElementById('f-cantidad').value) || 1;
  const tamano = document.getElementById('f-tamano').value.trim();
  const decoracion = document.getElementById('f-decoracion').value.trim();
  const saborMasa = document.getElementById('f-sabor-masa').value.trim();
  const saborRelleno = document.getElementById('f-sabor-relleno').value.trim();
  const fechaEntrega = document.getElementById('f-fecha').value;
  const hora = document.getElementById('f-hora').value;
  const precioUnitario = Number(document.getElementById('f-precio').value) || 0;
  const precio = precioUnitario * cantidad;
  const abono = Number(document.getElementById('f-abono').value) || 0;
  const saldo = Math.max(0, precio - abono);
  const notas = document.getElementById('f-notas').value.trim();
  const notasPrivadas = document.getElementById('f-notas-privadas').value.trim();

  if(!producto){ showToast('Escribe el producto'); return; }
  if(!fechaEntrega){ showToast('Elige la fecha de entrega'); return; }

  if(id){
    const p = DATA.pedidos.find(x=>x.id===id);
    Object.assign(p, {clienteId, clienteNombre, telefono, producto, cantidad, tamano, decoracion, saborMasa, saborRelleno, fechaEntrega, hora, precioUnitario, precio, abono, saldo, notas, notasPrivadas});
  } else {
    DATA.pedidos.push({ id: uid(), clienteId, clienteNombre, telefono, producto, cantidad, tamano, decoracion, saborMasa, saborRelleno, fechaEntrega, hora, precioUnitario, precio, abono, saldo, notas, notasPrivadas, estado:'pendiente', fotos:[] });
  }
  await saveKey('pedidos', DATA.pedidos);
  closeModal();
  renderPedidos();
  showToast('Pedido guardado 🎉');
}

async function deletePedido(id){
  if(!confirm('¿Eliminar este pedido?')) return;
  DATA.pedidos = DATA.pedidos.filter(p=>p.id!==id);
  await saveKey('pedidos', DATA.pedidos);
  renderPedidos();
}

function sendWhatsapp(id){
  const p = DATA.pedidos.find(x=>x.id===id);
  if(!p) return;
  const tel = digitsOnly(p.telefono);
  if(!tel || tel.length < 8){
    showToast('Este cliente no tiene un WhatsApp válido guardado');
    return;
  }
  const negocioLine = (CONFIG.nombreNegocio || CONFIG.infoNegocio)
    ? `\n${CONFIG.nombreNegocio||''}${CONFIG.infoNegocio ? ' — '+CONFIG.infoNegocio : ''}` : '';
  const msg = `¡Hola ${p.clienteNombre}! 🧁 Te confirmo tu pedido:\n` +
    `• Producto: ${p.producto} (x${p.cantidad})\n` +
    (p.tamano ? `• Tamaño: ${p.tamano}\n` : '') +
    (p.saborMasa ? `• Sabor de masa: ${p.saborMasa}\n` : '') +
    (p.saborRelleno ? `• Sabor de relleno: ${p.saborRelleno}\n` : '') +
    (p.decoracion ? `• Decoración: ${p.decoracion}\n` : '') +
    `• Precio total: ${fmtMoney(p.precio)}\n` +
    (p.abono>0 ? `• Abono pagado: ${fmtMoney(p.abono)}\n` : '') +
    (p.saldo>0 ? `• Saldo pendiente: ${fmtMoney(p.saldo)}\n` : '') +
    `• Fecha de entrega: ${fmtDateHuman(p.fechaEntrega)}${p.hora ? ' a las '+p.hora : ''}\n` +
    (p.notas ? `• Notas: ${p.notas}\n` : '') +
    `\n¡Gracias por tu compra! 💕` + negocioLine;
  const url = `https://wa.me/${tel}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

/* ---------------- CALENDARIO ---------------- */
function renderCalendar(){
  const year = calDate.getFullYear(), month = calDate.getMonth();
  document.getElementById('calTitle').textContent = calDate.toLocaleDateString('es-ES', {month:'long', year:'numeric'});
  const grid = document.getElementById('calGrid');
  const dows = ['L','M','X','J','V','S','D'];
  let html = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');

  const firstDay = new Date(year, month, 1);
  let startOffset = (firstDay.getDay() + 6) % 7; // Monday=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayIso = new Date().toISOString().slice(0,10);

  const countsByDay = {};
  DATA.pedidos.forEach(p=>{
    if(p.fechaEntrega){ countsByDay[p.fechaEntrega] = (countsByDay[p.fechaEntrega]||0)+1; }
  });

  for(let i=0;i<startOffset;i++) html += `<div class="cal-day empty-day"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = iso === todayIso;
    const isSelected = iso === calSelected;
    const hasOrders = !!countsByDay[iso];
    html += `<div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''}" onclick="calSelectDay('${iso}')">
      ${d}${hasOrders?'<span class="dot"></span>':''}
    </div>`;
  }
  grid.innerHTML = html;
  renderCalDayList();
}

function calShiftMonth(delta){
  calDate = new Date(calDate.getFullYear(), calDate.getMonth()+delta, 1);
  renderCalendar();
}
function calSelectDay(iso){
  calSelected = (calSelected===iso) ? null : iso;
  renderCalendar();
}
function renderCalDayList(){
  const box = document.getElementById('calDayList');
  if(!calSelected){ box.innerHTML=''; return; }
  const pedidosDia = DATA.pedidos.filter(p=>p.fechaEntrega===calSelected);
  if(pedidosDia.length===0){
    box.innerHTML = `<h3>${fmtDateHuman(calSelected)}</h3><div class="empty" style="padding:20px;"><p>No hay entregas este día.</p></div>`;
    return;
  }
  box.innerHTML = `<h3>Entregas — ${fmtDateHuman(calSelected)}</h3>` + pedidosDia.map(p=>`
    <div class="ticket">
      <div class="ticket-top">
        <div>
          <div class="name">${escapeHtml(p.clienteNombre)}</div>
          <div class="prod">${escapeHtml(p.producto)} · x${p.cantidad}</div>
        </div>
        <div class="stamp ${p.estado}">${statusLabel(p.estado)}</div>
      </div>
      <div class="ticket-actions">
        <button class="btn-mini whatsapp" onclick="sendWhatsapp('${p.id}')">📲 WhatsApp</button>
        <button class="btn-mini" onclick="sendWhatsappCopy('${p.id}')">📤 Copia a mí</button>
        <button class="btn-mini edit" onclick="openPedidoModal('${p.id}')">✏️ Editar</button>
      </div>
    </div>
  `).join('');
}

/* ---------------- PRECIOS / COSTOS ---------------- */
function renderPrecios(){
  const list = document.getElementById('preciosList');
  if(DATA.productos.length===0){
    list.innerHTML = `<div class="empty"><span class="icon">💲</span><p><b>Aún no calculas precios aquí.</b></p><p>Toca "Calcular precio" para tu primer producto.</p></div>`;
    return;
  }
  list.innerHTML = DATA.productos.map(p => `
    <div class="price-card">
      <div class="p-name">${escapeHtml(p.nombre)}</div>
      <div class="p-breakdown">Ingredientes ${fmtMoney(p.costoIngredientes)} + mano de obra ${fmtMoney(p.costoManoObra)} · margen ${p.margen}%</div>
      <div class="p-final"><span class="amount">${fmtMoney(p.precioFinal)}</span><span class="label">precio de venta sugerido</span></div>
      <div class="ticket-actions">
        <button class="btn-mini edit" onclick="openProductoModal('${p.id}')">✏️ Editar</button>
        <button class="btn-mini danger" onclick="deleteProducto('${p.id}')">🗑️</button>
      </div>
    </div>
  `).join('');
}

function openProductoModal(id){
  const editing = id ? DATA.productos.find(p=>p.id===id) : null;
  openModalHtml(`
    <h2>${editing?'Editar precio':'Calcular precio'}</h2>
    <div class="field"><label>Nombre del producto</label><input id="f-p-nombre" value="${editing?escapeAttr(editing.nombre):''}" placeholder="Ej: Cupcakes de chocolate (docena)"></div>
    <div class="field-row">
      <div class="field"><label>Costo ingredientes</label><input id="f-p-ing" type="number" min="0" value="${editing?editing.costoIngredientes:''}" placeholder="0" oninput="previewPrecio()"></div>
      <div class="field"><label>Mano de obra / otros</label><input id="f-p-mano" type="number" min="0" value="${editing?editing.costoManoObra:''}" placeholder="0" oninput="previewPrecio()"></div>
    </div>
    <div class="field"><label>Margen de ganancia deseado (%)</label><input id="f-p-margen" type="number" min="0" max="95" value="${editing?editing.margen:40}" oninput="previewPrecio()"></div>
    <div class="helper" id="precioPreview">Precio sugerido: —</div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveProducto(${editing?`'${editing.id}'`:'null'})">Guardar</button>
    </div>
  `);
  previewPrecio();
}

function calcPrecio(costoIng, costoMano, margen){
  const base = costoIng + costoMano;
  const m = Math.min(Math.max(margen,0),95);
  return base / (1 - (m/100));
}
function previewPrecio(){
  const ing = Number(document.getElementById('f-p-ing').value)||0;
  const mano = Number(document.getElementById('f-p-mano').value)||0;
  const margen = Number(document.getElementById('f-p-margen').value)||0;
  const precio = calcPrecio(ing, mano, margen);
  document.getElementById('precioPreview').textContent = 'Precio sugerido: ' + fmtMoney(precio);
}

async function saveProducto(id){
  const nombre = document.getElementById('f-p-nombre').value.trim();
  const costoIngredientes = Number(document.getElementById('f-p-ing').value)||0;
  const costoManoObra = Number(document.getElementById('f-p-mano').value)||0;
  const margen = Number(document.getElementById('f-p-margen').value)||0;
  if(!nombre){ showToast('Escribe el nombre del producto'); return; }
  const precioFinal = Math.round(calcPrecio(costoIngredientes, costoManoObra, margen));
  if(id){
    const p = DATA.productos.find(x=>x.id===id);
    Object.assign(p, {nombre, costoIngredientes, costoManoObra, margen, precioFinal});
  } else {
    DATA.productos.push({ id: uid(), nombre, costoIngredientes, costoManoObra, margen, precioFinal });
  }
  await saveKey('productos', DATA.productos);
  closeModal();
  renderPrecios();
  showToast('Precio guardado');
}

async function deleteProducto(id){
  if(!confirm('¿Eliminar este producto de tu lista de precios?')) return;
  DATA.productos = DATA.productos.filter(p=>p.id!==id);
  await saveKey('productos', DATA.productos);
  renderPrecios();
}

/* ---------------- INVENTARIO ---------------- */
function renderInventario(){
  const list = document.getElementById('inventarioList');
  if(DATA.inventario.length===0){
    list.innerHTML = `<div class="empty"><span class="icon">🧺</span><p><b>Sin ingredientes registrados.</b></p><p>Agrega los que usas para controlar tu stock.</p></div>`;
    return;
  }
  list.innerHTML = DATA.inventario.map(i => {
    const low = i.stock <= i.stockMinimo;
    const pct = i.stockMinimo>0 ? Math.min(100, Math.round((i.stock / (i.stockMinimo*2 || 1))*100)) : 100;
    return `
    <div class="ing-row">
      <div class="ing-top">
        <b>${escapeHtml(i.nombre)}</b>
        ${low ? `<span class="ing-low">Stock bajo</span>` : ''}
      </div>
      <div class="ing-stock-row">
        <div class="stock-bar-track"><div class="stock-bar-fill ${low?'low':''}" style="width:${pct}%;"></div></div>
        <div class="stock-num">${i.stock} ${escapeHtml(i.unidad)}</div>
      </div>
      <div class="qty-btns">
        <button class="qty-btn" onclick="adjustStock('${i.id}', -1)">−</button>
        <button class="qty-btn" onclick="adjustStock('${i.id}', 1)">+</button>
        <button class="btn-mini edit" onclick="openIngredienteModal('${i.id}')">✏️ Editar</button>
        <button class="btn-mini danger" onclick="deleteIngrediente('${i.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function openIngredienteModal(id){
  const editing = id ? DATA.inventario.find(i=>i.id===id) : null;
  openModalHtml(`
    <h2>${editing?'Editar ingrediente':'Nuevo ingrediente'}</h2>
    <div class="field"><label>Nombre</label><input id="f-i-nombre" value="${editing?escapeAttr(editing.nombre):''}" placeholder="Ej: Harina de trigo"></div>
    <div class="field-row">
      <div class="field"><label>Stock actual</label><input id="f-i-stock" type="number" min="0" value="${editing?editing.stock:''}" placeholder="0"></div>
      <div class="field"><label>Unidad</label><input id="f-i-unidad" value="${editing?escapeAttr(editing.unidad):''}" placeholder="kg, g, unidades…"></div>
    </div>
    <div class="field"><label>Stock mínimo (para avisarte)</label><input id="f-i-min" type="number" min="0" value="${editing?editing.stockMinimo:''}" placeholder="0"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveIngrediente(${editing?`'${editing.id}'`:'null'})">Guardar</button>
    </div>
  `);
}

async function saveIngrediente(id){
  const nombre = document.getElementById('f-i-nombre').value.trim();
  const stock = Number(document.getElementById('f-i-stock').value)||0;
  const unidad = document.getElementById('f-i-unidad').value.trim() || 'unid.';
  const stockMinimo = Number(document.getElementById('f-i-min').value)||0;
  if(!nombre){ showToast('Escribe el nombre del ingrediente'); return; }
  if(id){
    const i = DATA.inventario.find(x=>x.id===id);
    Object.assign(i, {nombre, stock, unidad, stockMinimo});
  } else {
    DATA.inventario.push({ id: uid(), nombre, stock, unidad, stockMinimo });
  }
  await saveKey('inventario', DATA.inventario);
  closeModal();
  renderInventario();
  showToast('Ingrediente guardado');
}

async function adjustStock(id, delta){
  const i = DATA.inventario.find(x=>x.id===id);
  if(!i) return;
  i.stock = Math.max(0, i.stock + delta);
  await saveKey('inventario', DATA.inventario);
  renderInventario();
}

async function deleteIngrediente(id){
  if(!confirm('¿Eliminar este ingrediente?')) return;
  DATA.inventario = DATA.inventario.filter(i=>i.id!==id);
  await saveKey('inventario', DATA.inventario);
  renderInventario();
}

/* ---------------- Helpers de escape ---------------- */
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* ---------------- Init ---------------- */
function waitForGoogleIdentity(timeoutMs){
  return new Promise((resolve)=>{
    const start = Date.now();
    (function check(){
      if(typeof google !== 'undefined' && google.accounts && google.accounts.oauth2){ resolve(true); return; }
      if(Date.now() - start > timeoutMs){ resolve(false); return; }
      setTimeout(check, 100);
    })();
  });
}

async function init(){
  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});

  if(window.storage){
    STORAGE_MODE = 'claude';
    await loadAll();
    document.getElementById('loadingScreen').style.display = 'none';
    finishInit();
    return;
  }

  document.getElementById('loadingScreen').style.display = 'none';
  let savedMode = null;
  try{ savedMode = localStorage.getItem('agendaStorageMode'); }catch(e){}

  if(savedMode === 'local'){
    STORAGE_MODE = 'local';
    await loadAll();
    finishInit();
    return;
  }
  if(savedMode === 'drive'){
    await initDriveFlow();
    return;
  }
  renderStorageChoiceScreen();
}

function renderStorageChoiceScreen(){
  const el = document.getElementById('driveScreen');
  document.getElementById('app').style.display = 'none';
  el.innerHTML = `
    <div class="emoji">🧁📲</div>
    <h2>¿Dónde quieres guardar tus datos?</h2>
    <p>Puedes cambiarlo después desde Ajustes ⚙️.</p>
    <button class="btn-primary" style="max-width:280px; margin-bottom:12px;" onclick="chooseStorageMode('local')">📱 En este teléfono (sin internet)</button>
    <button class="btn-secondary" style="max-width:280px;" onclick="chooseStorageMode('drive')">☁️ Google Drive (sincroniza entre dispositivos)</button>
    <p style="font-size:11.5px; margin-top:18px;">"En este teléfono" es más simple y no necesita cuenta, pero los datos solo viven en este navegador — si borras datos de navegación o cambias de celular, se pierden (usa la copia de seguridad en Ajustes para respaldarlos).</p>
  `;
  el.style.display = 'flex';
}

async function chooseStorageMode(mode){
  try{ localStorage.setItem('agendaStorageMode', mode); }catch(e){}
  if(mode === 'local'){
    STORAGE_MODE = 'local';
    await loadAll();
    finishInit();
  } else {
    await initDriveFlow();
  }
}

async function initDriveFlow(){
  STORAGE_MODE = 'drive';
  if(GOOGLE_CLIENT_ID.indexOf('PON_AQUI') !== -1){
    renderDriveConfigError('Falta configurar el Client ID de Google en el código de esta app. Sigue los pasos de configuración que te dieron junto con este archivo.');
    return;
  }
  const googleReady = await waitForGoogleIdentity(6000);
  if(!googleReady){
    renderDriveConfigError('No se pudo cargar el inicio de sesión de Google. Revisa tu conexión a internet y recarga la página. Si usas un bloqueador de anuncios/rastreadores, prueba desactivarlo para este sitio.');
    return;
  }
  initGoogleAuth();
  renderDriveConnectScreen();
  let wasConnected = false;
  try{ wasConnected = localStorage.getItem('agendaDriveConnected') === '1'; }catch(e){}
  if(wasConnected){ connectDrive(false); }
}

function changeStorageMode(){
  if(!confirm('¿Cambiar dónde se guardan tus datos? Se cerrará la sesión actual y volverás a elegir. Si tienes datos importantes, descarga primero una copia de seguridad en Ajustes.')) return;
  try{ localStorage.removeItem('agendaStorageMode'); localStorage.removeItem('agendaDriveConnected'); }catch(e){}
  location.reload();
}

/* ---------------- Copia de seguridad (exportar / importar) ---------------- */
function exportBackup(){
  const backup = {
    tipo: 'agenda-pastelera-backup',
    exportadoEl: new Date().toISOString(),
    clientes: DATA.clientes, pedidos: DATA.pedidos, productos: DATA.productos, inventario: DATA.inventario,
    config: CONFIG
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `agenda-pastelera-backup-${fecha}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Copia de seguridad descargada');
}

function triggerImportBackup(){
  document.getElementById('importFileInput').click();
}

async function handleImportBackup(input){
  const file = input.files && input.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup || backup.tipo !== 'agenda-pastelera-backup'){
      showToast('Ese archivo no parece una copia de seguridad válida');
      return;
    }
    if(!confirm('Esto reemplazará todos los datos actuales de la app con los del archivo. ¿Continuar?')) return;
    DATA.clientes = backup.clientes || [];
    DATA.pedidos = backup.pedidos || [];
    DATA.productos = backup.productos || [];
    DATA.inventario = backup.inventario || [];
    CONFIG = Object.assign({ miWhatsapp:'', nombreNegocio:'', infoNegocio:'', pin:'', pinEnabled:false }, backup.config || {});
    await Promise.all([
      saveKey('clientes', DATA.clientes), saveKey('pedidos', DATA.pedidos),
      saveKey('productos', DATA.productos), saveKey('inventario', DATA.inventario),
      saveObj('config', CONFIG)
    ]);
    closeModal();
    switchTab('pedidos');
    showToast('Copia de seguridad restaurada ✅');
  }catch(e){
    showToast('No se pudo leer ese archivo');
  }
  input.value = '';
}

function finishInit(){
  document.getElementById('driveScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  if(STORAGE_MODE === 'drive'){
    document.getElementById('driveStatusDot').style.display = 'inline-block';
  }
  switchTab('pedidos');
  if(CONFIG.pinEnabled && CONFIG.pin){
    document.getElementById('app').style.display = 'none';
    document.getElementById('lockScreen').style.display = 'flex';
    setTimeout(()=>document.getElementById('lockInput').focus(), 50);
  }
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
init();
</script>
<input type="file" id="importFileInput" accept="application/json" style="display:none;" onchange="handleImportBackup(this)">
</body>
